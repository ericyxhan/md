<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA fallback for static hosts (e.g. GitHub Pages)
      (function () {
        var path = window.location.pathname;
        if (path !== '/' && path !== '/index.html') {
          window.location.replace('/?p=' + encodeURIComponent(path));
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
