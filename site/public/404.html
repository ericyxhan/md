<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var path = window.location.pathname;
        var base = window.location.pathname.split('/').slice(0, -1).join('/') + '/';
        // Redirect to the app root preserving the path in ?p=
        var url = window.location.origin + base + '?p=' + encodeURIComponent(path);
        window.location.replace(url);
      })();
    </script>
  </head>
  <body></body>
</html>
